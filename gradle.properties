# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=0.0.10
group=com.dwinovo.numen
java_version=17
momo_engine_version=0.0.9-SNAPSHOT
momo_engine_version_range=[0.0.9-SNAPSHOT,)

# Common
minecraft_version=1.20.1
mod_name=Momo Gameplay
mod_author=dwinovo, afu6609
mod_id=momo_gameplay
artifact_base_name=momo-gameplay
license=LGPL-3.0-only
credits=Gameplay pack migrated from Dwinovo/minecraft-numen under the GNU LGPL v3.0; the com.dwinovo.numen transition ABI is intentionally retained.
description=Perception, planning, skills, and harness support for Momo Engine. Legacy physical tasks remain available only in standalone mode and are disabled when momo_embodied owns the body.
minecraft_version_range=[1.20.1, 1.21)

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.92.1+1.20.1
fabric_loader_version=0.15.11

# Forge, see https://files.minecraftforge.net/ for new versions
forge_version=47.2.30
forge_version_range=[47,)
forge_loader_version_range=[47,)

# LLM transport uses java.net.http.HttpClient (JDK built-in, Java 11+) and
# Gson (already on the MC classpath). No third-party HTTP / SDK dependencies.

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Local Momo Engine resolution/publishing defaults to the sibling ../numen-maven.
# Override with -Plocal_maven_url=... or the local_maven_url environment variable.
